upstream auth_service {
    server auth-service:8004;
}

upstream orders_service {
    server orders:8003;
}

upstream products_service {
    server products:8002;
}

upstream emails_service {
    server emails:8001;
}

server {
    listen 80;

    location /api/auth/ {
    proxy_pass http://auth_service/;
    proxy_set_header Host auth-service;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders/ {
        proxy_pass http://orders_service/;
        proxy_set_header Host orders;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/products/ {
        proxy_pass http://products_service/;
        proxy_set_header Host products;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/emails/ {
        proxy_pass http://emails_service/;
        proxy_set_header Host emails;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}