name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure

      - name: Create tfvars
        working-directory: infra
        run: |
          cat > terraform.tfvars <<EOF
          rabbitmq_user      = "${{ secrets.RABBITMQ_USER }}"
          rabbitmq_password  = "${{ secrets.RABBITMQ_PASSWORD }}"
          django_secret_key  = "${{ secrets.DJANGO_SECRET_KEY }}"
          EOF

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        working-directory: infra
        run: |
          echo "CLOUDFRONT_DOMAIN=$(terraform output -raw cloudfront_domain)" >> $GITHUB_ENV

      - name: Create frontend .env
        run: |
          cat > frontend/.env <<EOF
          REACT_APP_AUTH_URL=https://${CLOUDFRONT_DOMAIN}/api/auth
          REACT_APP_ORDERS_URL=https://${CLOUDFRONT_DOMAIN}/api/orders
          REACT_APP_PRODUCTS_URL=https://${CLOUDFRONT_DOMAIN}/api/products
          REACT_APP_STRIPE_PUBLISHABLE_KEY="${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}"
          EOF

      - name: Build and deploy frontend
        run: |
          cd frontend
          npm install
          npm run build

          BUCKET=$(terraform -chdir=../infra output -raw frontend_bucket)
          DIST_ID=$(terraform -chdir=../infra output -raw cloudfront_id)

          aws s3 sync build/ s3://$BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"