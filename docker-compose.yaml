


services:

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - auth-service
            - orders
            - products
            - emails
        restart: always
        networks:
            - microservices-network

    emails:
        build: ./services/emails
        command: bash -c "uv run python3 manage.py runserver 0.0.0.0:8001"
        volumes:
            - ./services/emails:/app
            - /app/.venv
        ports:
            - 8001:8001
        restart: always
        depends_on:
            - emails-db
            - products-db
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_USER=${RABBITMQ_USER}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - SECRET_KEY=${SECRET_KEY}
        networks:
            - microservices-network
    
    emails-consumer:
        build: ./services/emails
        command: uv run python3 manage.py start_consumer
        depends_on:
            - products-db
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_USER=${RABBITMQ_USER}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - SECRET_KEY=${SECRET_KEY}
        restart: always
        networks:
            - microservices-network

    products:
        build: ./services/products
        # command: bash -c "uv run python3 manage.py runserver 0.0.0.0:8002"
        command: >
            sh -c "uv run python3 manage.py seed_products &&
                uv run python3 manage.py runserver 0.0.0.0:8002"
        volumes:
            - ./services/products:/app
            - /app/.venv
        ports:
            - 8002:8002
        restart: always
        depends_on:
            - products-db
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_USER=${RABBITMQ_USER}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - REDIS_URL=${REDIS_URL}
            - SECRET_KEY=${SECRET_KEY}
        networks:
            - microservices-network
    
    products-consumer:
        build: ./services/products
        command: uv run python3 manage.py start_consumer
        depends_on:
            - products-db
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_USER=${RABBITMQ_USER}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - REDIS_URL=${REDIS_URL}
            - SECRET_KEY=${SECRET_KEY}
        restart: always
        networks:
            - microservices-network

    orders:
        build: ./services/orders
        command: bash -c "uv run python3 manage.py runserver 0.0.0.0:8003"
        volumes:
            - ./services/orders:/app
            - /app/.venv
        ports:
            - 8003:8003
            - 5678:5678
        restart: always
        depends_on:
            - orders-db
            - auth-service
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_USER=${RABBITMQ_USER}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - SECRET_KEY=${SECRET_KEY}
        networks:
            - microservices-network

    auth-service:
        build: ./services/auth_service
        command: >
            sh -c "uv run python3 manage.py wait_for_db &&
             uv run python3 manage.py seed_users &&
             uv run python3 manage.py runserver 0.0.0.0:8004"
        volumes:
            - ./services/auth_service:/app
            - /app/.venv
        ports:
            - 8004:8004
        restart: always
        depends_on:
            - auth-service-db
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_USER=${RABBITMQ_USER}
            - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - SECRET_KEY=${SECRET_KEY}
        networks:
            - microservices-network

    emails-db:
        image: postgres:14.2-alpine
        restart: unless-stopped
        volumes:
            - .postgres_data/emails_data:/var/lib/postgres
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=root
            - POSTGRES_DB=admin
        ports:
            - "5432:5432"
        networks:
            - microservices-network

    orders-db:
        image: postgres:14.2-alpine
        restart: unless-stopped
        volumes:
            - .postgres_data/orders_data:/var/lib/postgres
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=root
            - POSTGRES_DB=admin
        ports:
            - "5433:5432"
        networks:
            - microservices-network

    products-db:
        image: postgres:14.2-alpine
        restart: unless-stopped
        volumes:
            - .postgres_data/products_data:/var/lib/postgres
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=root
            - POSTGRES_DB=admin
        ports:
            - "5434:5432"
        networks:
            - microservices-network

    auth-service-db:
        image: postgres:14.2-alpine
        restart: unless-stopped
        volumes:
            - .postgres_data/auth_data:/var/lib/postgres
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=root
            - POSTGRES_DB=admin
        ports:
            - "5435:5432"
        networks:
            - microservices-network

networks:
    microservices-network:
        driver: bridge